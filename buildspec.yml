version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - npm ci
  build:
    commands:
      - echo Building the application...
      - npm run build
  post_build:
    commands:
      - echo Build completed
artifacts:
  files:
    - "**/*"
  exclude-files:
    - node_modules/**
    - .git/**
    - .next/cache/**
    - README.md
    - .env*
  base-directory: .
